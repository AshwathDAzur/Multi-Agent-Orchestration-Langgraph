# NGINX reverse proxy — single public entry point (:8080).
#
#   /          -> frontend (static React, served by the frontend nginx)
#   /api/*     -> BFF (protected API; forwards to aiBackend)
#   /auth/*    -> BFF (Keycloak OIDC login/logout/callback)
#
# aiBackend is NEVER exposed here — only the BFF can reach it internally.

events {}

http {
  # gzip for smaller responses
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS and RE-RESOLVE upstreams per request. Putting
    # the hostname in a variable (instead of a static `upstream` block) stops
    # nginx from caching a stale/wrong IP at startup when a backend is still
    # coming up. 'valid=10s' keeps DNS fresh as containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ----- BFF: auth flows -----
    location /auth/ {
      set $bff http://bff:4000;
      proxy_pass $bff;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- BFF: protected API -----
    location /api/ {
      set $bff http://bff:4000;
      proxy_pass $bff;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- Frontend: everything else -----
    location / {
      set $frontend http://frontend:80;
      proxy_pass $frontend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
